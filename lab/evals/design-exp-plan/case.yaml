schema_version: "1.1"
name: design-exp-plan
description: /lab:design-exp drafts a complete PLAN.md (prediction, kill criteria, baseline, ceiling, >=3 seeds, protected files), logs the prediction, gets a skeptic review, and does NOT approve the plan itself (G3).
tags: [experiment]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 50
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash, Write, Edit]
