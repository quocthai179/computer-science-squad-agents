schema_version: "1.1"
name: read-paper-card
description: /lab:read-paper on a fixed synthetic paper file produces a complete paper card with located quotes and explain-back questions.
tags: [smoke, reading]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash, Write, Edit]
