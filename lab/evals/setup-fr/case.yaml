schema_version: "1.1"
name: setup-fr
description: A French request starts /lab:setup; the workspace is created in French (templates/fr), CLAUDE.md records the language, and the Lead replies in French with at most 3 interview questions.
tags: [i18n, fr]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
